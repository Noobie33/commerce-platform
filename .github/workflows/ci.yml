name: Verify workspace
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: |
          node src/scripts/provision-local.mjs
          node src/scripts/provision-video-workers.mjs
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: postgres
          PGPASSWORD: ci-disposable-only
      - run: npm run secrets:check
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - name: Install video processing tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Verify and test private video processing
        env:
          FFMPEG_PATH: /usr/bin/ffmpeg
          FFPROBE_PATH: /usr/bin/ffprobe
          VIDEO_WORK_DIR: ${{ runner.temp }}/commerce-video-work
          VIDEO_ARTIFACT_DIR: ${{ runner.temp }}/commerce-video-artifacts
        run: |
          node dist/src/scripts/verify-video-tools.js
          node --test --test-concurrency=1 dist/test/video-processing.integration.js
      - run: npm run test:database
      - run: npm run db:verify-local
      - run: node --env-file=.env.test dist/src/scripts/verify-media-storage.js
      - run: node --env-file=.env.test dist/src/scripts/verify-inventory.js
      - run: node --env-file=.env.test dist/src/scripts/verify-purchasing.js
      - run: node --env-file=.env.test dist/src/scripts/verify-invoices.js
      - run: node --env-file=.env.test dist/src/scripts/verify-payments.js
      - run: node --env-file=.env.test dist/src/scripts/verify-customers.js
      - run: node --env-file=.env.test dist/src/scripts/verify-sales.js
      - run: node --env-file=.env.test dist/src/scripts/verify-reservations.js
      - run: node --env-file=.env.test dist/src/scripts/verify-content.js
      - run: node --env-file=.env.test dist/src/scripts/verify-merchandising.js
      - run: node --env-file=.env.test dist/src/scripts/verify-presentation.js
      - run: node --env-file=.env.test dist/src/scripts/verify-publication.js
      - run: node --env-file=.env.test dist/src/scripts/verify-staff-access.js
      - run: node --env-file=.env.test dist/src/scripts/verify-staff-onboarding.js
      - run: node --env-file=.env.test dist/src/scripts/verify-video-intake.js
      - run: node --env-file=.env.test dist/src/scripts/verify-gallery.js
